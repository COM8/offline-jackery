bind_shelly_bridge:
  name: Bind Shelly bridge
  description: Bind a configured local Shelly/HomeWizard bridge to a SolarVault over Bluetooth.
  fields:
    config_entry_id:
      name: Jackery config entry
      description: The config entry ID of the target Jackery SolarVault.
      required: true
      selector:
        config_entry:
          integration: offline_jackery
    bridge_serial:
      name: Bridge serial
      description: The 12-digit hexadecimal serial shown by the bridge entry.
      required: true
      selector:
        text:
show_firmware_download_urls:
  name: Show firmware download URLs
  description: Log in to Jackery once and return available SolarVault firmware module URLs without starting an update.
  fields:
    config_entry_id:
      name: Jackery config entry
      description: The config entry ID of the target SolarVault.
      required: true
      selector:
        config_entry:
          integration: offline_jackery
    login_method:
      name: Login method
      required: true
      selector:
        select:
          options:
            - email
            - phone
    account:
      name: Email or phone number
      required: true
      selector:
        text:
    password:
      name: Jackery password
      description: Used for this request only; avoid putting it in an automation.
      required: true
      selector:
        text:
          type: password
    region:
      name: Region code
      description: Two-letter region code required for email login (for example, DE).
      selector:
        text:
